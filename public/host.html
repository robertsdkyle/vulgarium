<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0820">
<title>Party Box — TV</title>
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="linkbar" id="linkbar" hidden>Reconnecting<span class="waiting-dots"></span></div>
<div class="tv">
  <header class="tv-head">
    <div class="wordmark">PARTY <b>BOX</b></div>
    <div class="head-right">
      <button class="sound-btn" id="soundBtn" type="button" aria-label="Sound"></button>
      <div class="aud-count" id="audCount" hidden></div>
      <div class="timer" id="timer" hidden><span class="timer-num" id="timerNum">0</span></div>
      <div class="eyebrow" id="roundLabel"></div>
    </div>
  </header>
  <main class="tv-body" id="stage">
    <p class="hint">Starting up…</p>
  </main>
  <footer class="tv-foot" id="controls"></footer>
</div>
<script type="module" src="/js/tv.js"></script>
</body>
</html>
