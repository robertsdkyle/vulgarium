<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0820">
<meta name="description" content="Join a Party Box game from your phone.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Party Box">
<meta name="format-detection" content="telephone=no">
<title>Party Box</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
</head>
<body class="phone-page">
<div class="linkbar" id="linkbar" hidden>Reconnecting<span class="waiting-dots"></span></div>
<div class="phone">
  <div class="pbar-track" id="pbarTrack" hidden><div class="pbar" id="pbar"></div></div>
  <header class="phone-head">
    <div class="wordmark">PARTY <b>BOX</b></div>
    <div class="me" id="me"></div>
  </header>
  <main class="phone-body" id="stage">
    <p class="status"><strong>Loading</strong><span class="waiting-dots"></span></p>
  </main>
</div>
<script type="module" src="/js/phone.js"></script>
</body>
</html>
